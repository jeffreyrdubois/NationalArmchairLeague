# For Compose Manager on Unraid, and for non-Unraid hosts. The Unraid template
# in unraid/ is the first-class path there; this is the same container expressed
# the other way.
#
# This pulls the image GitHub Actions publishes on every merge to main, so
# updating is a pull and a restart rather than a rebuild — `./update.sh` does
# both. To build from your working tree instead, comment out `image:` and
# uncomment `build: .`.
services:
  nal:
    image: ghcr.io/jeffreyrdubois/nationalarmchairleague:latest
    # build: .
    container_name: nal
    restart: unless-stopped
    ports:
      # External port defaults to 8000; override with HOST_PORT in .env (e.g. 5950).
      # The container always listens on 8000 internally.
      - "${HOST_PORT:-8000}:8000"
    volumes:
      # SQLite database and the session signing key persist here.
      # Keep this on a cache pool, not a FUSE /mnt/user path — SQLite over
      # Unraid's user share layer has a long history of locking problems.
      - ./data:/app/data
    environment:
      # Loaded from .env file — never hardcode secrets here.
      # SECRET_KEY is optional: left unset, the container generates one into
      # ./data/secret.key on first boot and reuses it across updates.
      - SECRET_KEY
      - ODDS_API_KEY

      # Set to "false" once everyone has registered to prevent new signups
      - REGISTRATION_OPEN

      # "Submit an Issue" -> GitHub. Fill these in .env to enable issue reporting.
      - GITHUB_ISSUE_TOKEN
      - GITHUB_ISSUE_REPO

      # Optional override. Unset, the image defaults to the volume path above.
      - DATABASE_URL

      # File ownership on the ./data volume. 99:100 (nobody:users) is the
      # Unraid default and is almost always right.
      - PUID=99
      - PGID=100
      - TZ=America/New_York

    # For SWAG reverse proxy integration:
    # Make sure nal is on the same Docker network as SWAG
    # networks:
    #   - swag_default
    # Then in SWAG's nginx/proxy-confs/ create nal.subdomain.conf:
    #   proxy_pass http://nal:8000;

# networks:
#   swag_default:
#     external: true
