name: Issue run watchdog

# Re-trigger Cursor when triage ran but no PR/branch appeared — without
# colliding with a long in-flight run (see .github/scripts/issue_run_watchdog.py).

on:
  schedule:
  # Every 30 minutes; stall thresholds are enforced in the script (default 45m).
    - cron: "5,35 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-run-watchdog
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect stalled issue runs and nudge Cursor once
        env:
          GH_TOKEN: ${{ github.token }}
          WEBHOOK_URL: ${{ secrets.CURSOR_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.CURSOR_AUTOMATION_KEY }}
          ISSUE_RUN_STALL_MINUTES: "45"
          ISSUE_RUN_IN_PROGRESS_GRACE_MINUTES: "120"
          ISSUE_RUN_WATCHDOG_COOLDOWN_HOURS: "24"
        run: python3 .github/scripts/issue_run_watchdog.py
