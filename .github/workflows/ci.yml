name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      # Catches syntax errors and bad imports before a merge triggers a publish
      # — a fifteen-minute multi-arch build is an expensive place to find out
      # a module does not import.
      - name: Import the app
        run: python -c "from app.main import app; print(app.title)"

      # Every template is compiled, not just the ones the smoke test happens to
      # render. A typo in a Jinja tag is otherwise a 500 on one page nobody
      # visits until the season is underway.
      #
      # The app's own environment, not a bare one: Jinja resolves filter names
      # at compile time, so a template using `| enumerate` or `| eastern` only
      # compiles against the environment that registers them.
      - name: Compile the templates
        run: |
          python - <<'PY'
          from app.templates_config import templates

          env = templates.env
          names = env.list_templates(extensions=["html"])
          for name in names:
              env.get_template(name)
          print(f"compiled {len(names)} templates")
          PY

      # Editing picks after submitting them is the one flow with a database
      # constraint standing behind it: confidence points are unique per user
      # per week, so swapping two values has to be written carefully or the
      # save fails and the player is stuck with the picks they first entered.
      - name: Test editing submitted picks
        run: python tests/test_pick_editing.py

      # Pick secrecy is the rule the whole pool rests on: anyone who can read
      # another player's picks before the lock can just copy the field. It is
      # also the easiest thing to break by accident from a template, so these
      # drive the real pages and read the rendered HTML.
      - name: Test pick visibility before the lock
        run: python tests/test_pick_visibility.py

      # The GitHub token for "Submit an Issue" is now entered in the app, which
      # means the app is holding a credential: these check that a value saved
      # there beats the container's environment, and that the token never comes
      # back out in a page or the audit log.
      - name: Test issue-reporting settings
        run: python tests/test_issue_reporting.py

      # Scores are where the league's results come from, and the score sync
      # used to overwrite hand-entered finals with whatever the feed said —
      # which blanked them minutes after a contributor saved them and left
      # finished games reading "Upcoming" beside picks already scored.
      - name: Test score entry and the score sync
        run: python tests/test_score_entry.py

      # The all-picks grid freezes the viewer's own column, which only works if
      # the route orders the players with the viewer first — a plain-looking
      # line that the whole side-by-side comparison rests on.
      - name: Test the all-picks grid layout
        run: python tests/test_pick_matrix_layout.py

      # Payout amounts are never snapshotted — the plan is priced against the
      # standings on every page load, which is what lets a mid-season change
      # reach back and repay a week already played. That, the pool arithmetic
      # the playground warns on, and a tied podium splitting its places are the
      # three things nobody would notice were wrong until money changed hands.
      - name: Test prize payouts and the playground
        run: python tests/test_payouts.py
