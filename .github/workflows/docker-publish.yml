name: Publish Docker Image

on:
  push:
    branches: [main]
    tags: ['v*']
  # Builds and smoke-tests on a pull request too, without pushing. A change to
  # the Dockerfile or the entrypoint is otherwise only exercised after it has
  # already merged — and the first thing it would break is the update path
  # itself, which is the worst thing to have to fix by hand on the server.
  pull_request:
  # Publishing a branch on demand. Pull requests deliberately do not publish —
  # every PR push would be a multi-arch build and another image sitting in the
  # registry, for branches most of which are never installed. Instead: when a
  # branch is actually worth trying on the real league, run this workflow from
  # the Actions tab with that branch selected, and it publishes exactly one
  # image. The in-app updater lists it like any other version.
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Optional name for this build's image tag (e.g. "test" or "pr-54").
          Leave blank to publish only as sha-<commit>.
        required: false
        type: string

# Merging three pull requests in a row would otherwise cost three publishes, and
# the first two publish an image nobody will ever pull: `latest` only ever means
# the newest commit on main. Cancelling superseded runs makes a burst of merges
# cost one publish instead of one each.
#
# Grouped by ref so that a release tag build is never cancelled by a main merge
# landing while it runs — those are different images, not successive drafts of
# the same one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nationalarmchairleague

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Only the push needs this, and it is skipped on pull requests.
      packages: write
    steps:
      - uses: actions/checkout@v4

      # Every image built from main would otherwise report its version as the
      # literal string "main" — the same on every build, and so no help at all
      # with the question the version line exists to answer: did the update
      # actually apply. A release tag keeps its number; every other build gets
      # the VERSION file plus the commit it was built from.
      - id: build-info
        name: Work out the version and build time
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          base="$(tr -d '[:space:]' < VERSION)"
          commit="$(git rev-parse --short HEAD)"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
            version="${base}+${commit}"
          else
            # A hand-published branch: 1.0.0-claude-my-branch+a1b2c3d, so the
            # footer of a test install says what it is running rather than
            # looking like an ordinary build of main.
            slug="$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')"
            version="${base}-${slug}+${commit}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "built-at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            # The optional name given when publishing a branch by hand, so a
            # test build can be installed as "pr-54" rather than a commit hash.
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,format=short

      # Built for the host architecture first and actually started, so a broken
      # image fails here rather than on the server. The multi-arch push below
      # cannot be smoke-tested this way — buildx cannot load a manifest list
      # into the local daemon.
      - name: Build for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: nal:smoke
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_DATE=${{ steps.build-info.outputs.built-at }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          set -euo pipefail
          # No environment at all, and a fresh empty volume: that is the install
          # contract the Unraid template promises, so it is what gets asserted.
          docker run -d --name smoke -p 8000:8000 nal:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health > /tmp/health.json; then
              break
            fi
            sleep 2
          done
          cat /tmp/health.json
          grep -q '"status":"ok"' /tmp/health.json
          # The version the image reports is the only way anyone can tell which
          # build is running, so a build that cannot report it is broken in the
          # way that is hardest to notice later.
          grep -qF "\"version\":\"${{ steps.build-info.outputs.version }}\"" /tmp/health.json
          # The probe only ever runs inside the image; running it anywhere else
          # would not prove anything.
          docker exec smoke python /app/healthcheck.py
          # A signing key must have been generated with no SECRET_KEY given —
          # otherwise every install would sign cookies with the same source
          # default, and forging a login would be trivial.
          docker exec smoke test -s /app/data/secret.key
          # The app must have dropped to the Unraid default user, and the
          # database it created must be owned by that user rather than root.
          test "$(docker exec smoke stat -c '%u:%g' /app/data/nal.db)" = "99:100"
          # An anonymous request is redirected to the login page, not served.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/)" = "303"
          docker logs smoke
          docker rm -f smoke

      # In-app updating is the one feature whose hard part is host plumbing:
      # the socket is root-owned, the app runs as 99:100, and gosu drops
      # supplementary groups unless it is handed a user *name*. Get any of that
      # wrong and every Docker call comes back "permission denied" — on the
      # server, after a release. Unit tests cannot see any of it, so it is
      # exercised here against the runner's own daemon.
      - name: Smoke test the in-app updater
        run: |
          set -euo pipefail
          cat > /tmp/updater_check.py <<'PY'
          import json
          from app.services import docker_api, selfupdate

          status = docker_api.socket_status()
          print("socket:", status)
          assert status["ok"], status

          client = docker_api.DockerClient()
          container = client.inspect_container("smoke-updater")
          image = client.inspect_image(container["Image"])

          spec = selfupdate.build_container_spec(container, image, "example/new:tag")
          print(json.dumps(spec, indent=2)[:2000])

          # The bug that would make the update page lie about whether it worked:
          # APP_VERSION is baked into the image, so carrying the old container's
          # copy forward would have the new build report the old version.
          env = spec.get("Env", [])
          assert not any(e.startswith("APP_VERSION=") for e in env), env
          # Settings the operator passed in have to survive.
          assert "SMOKE_KEPT=yes" in env, env
          assert spec["Image"] == "example/new:tag", spec["Image"]
          # And the entrypoint must come from the new image, not be pinned here.
          assert "Entrypoint" not in spec, spec.get("Entrypoint")
          print("updater checks passed")
          PY

          docker run -d --name smoke-updater \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -e SMOKE_KEPT=yes \
            -e UPDATE_CONTAINER_NAME=smoke-updater \
            nal:smoke
          for i in $(seq 1 30); do
            if docker exec smoke-updater python /app/healthcheck.py >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          docker logs smoke-updater

          # The entrypoint has to have put the app user in the socket's group.
          docker exec smoke-updater id nal
          # The data volume must still be owned exactly as before — the socket
          # group is supplementary, it must not become the primary one.
          test "$(docker exec smoke-updater stat -c '%u:%g' /app/data/nal.db)" = "99:100"

          docker cp /tmp/updater_check.py smoke-updater:/tmp/updater_check.py
          # As `nal`, not as root and not as 99:100 — the username form is the
          # only one that carries the supplementary group, and it is what the
          # entrypoint uses to launch the app.
          docker exec -u nal -w /app smoke-updater python /tmp/updater_check.py

          docker rm -f smoke-updater

      - name: Build and push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.build-info.outputs.version }}
            BUILD_DATE=${{ steps.build-info.outputs.built-at }}
            GIT_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
